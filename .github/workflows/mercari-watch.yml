name: Mercari keyword watch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "테스트 메일 보내기 (감시 기록은 바뀌지 않음)"
        type: boolean
        default: false

concurrency:
  group: mercari-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography==43.0.3

      - name: Restore seen items
        uses: actions/cache/restore@v4
        with:
          path: mercari-watch/seen.json
          key: mercari-seen-${{ github.run_id }}
          restore-keys: mercari-seen-

      - name: Check Mercari
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          WATCH_CONFIG: ${{ secrets.WATCH_CONFIG }}
          TEST_EMAIL: ${{ inputs.test_email && '1' || '' }}
        run: python mercari-watch/watch.py

      - name: Save seen items
        if: always() && hashFiles('mercari-watch/seen.json') != ''
        uses: actions/cache/save@v4
        with:
          path: mercari-watch/seen.json
          key: mercari-seen-${{ github.run_id }}-${{ github.run_attempt }}
